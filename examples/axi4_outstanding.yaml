schema_version: 10
name: outstanding
address_width: 32
reset_ports: [{name: reset_n}]
test_ports: [{name: test}]
clock_domains: [{name: main, clock_port: clk_main, reset_port: reset_n, test_port: test}]
# cpu0 shares four burst slots across reads and writes; cpu1 has one shared slot.
# The bursts of one AXI ID in flight on a direction of cpu0 go to one
# destination and return in issue order; different IDs may be in flight at
# different targets and return in any order.
initiators:
  - {name: cpu0, clock_domain: main, data_width: 32, protocol: axi4, max_outstanding: 4, len_width: 8}
  - {name: cpu1, clock_domain: main, data_width: 32, protocol: axi4, len_width: 8}
# dram0 shares four packet slots across reads and writes. Same-ID reads may
# overlap; merged writes from a source retain one AxID. Port IDs follow
# definition.target_ids in the generated map.
targets:
  - {name: dram0, clock_domain: main, data_width: 32, protocol: axi4, len_width: 8, attributes: amba, mappings: [{base: '0x80000000', size: '0x10000000'}],
     max_outstanding: 4}
  - {name: sram0, clock_domain: main, data_width: 32, protocol: axi4, mappings: [{base: '0x10000', size: '0x10000'}], len_width: 8, attributes: amba}
  - {name: uart0, clock_domain: main, data_width: 32, protocol: apb4, mappings: [{base: '0x40000', size: '0x1000'}], attributes: amba}
transport:
  max_outstanding: 1
  transport_word_bytes: 4
topology:
  request:
    nodes: [{name: fanout}]
    links: []
    entries: [{endpoint: cpu0, node: fanout}, {endpoint: cpu1, node: fanout}]
    exits:
      - {endpoint: dram0, node: fanout}
      - {endpoint: sram0, node: fanout}
      - {endpoint: uart0, node: fanout}
  response:
    nodes: [{name: fanin}]
    links: []
    entries:
      - {endpoint: dram0, node: fanin}
      - {endpoint: sram0, node: fanin}
      - {endpoint: uart0, node: fanin}
    exits: [{endpoint: cpu0, node: fanin}, {endpoint: cpu1, node: fanin}]
connectivity: all
output: {backend: verilog, language: verilog_2001}

schema_version: 10
name: mode_remap
address_width: 32
reset_ports: [{name: reset_n}]
test_ports: [{name: test}]
clock_domains: [{name: main, clock_port: clk_main, reset_port: reset_n, test_port: test}]
address_inputs:
  - {name: boot, width: 1, clock_domain: main}
  - {name: bank, width: 2, clock_domain: main}
address_selectors:
  - {name: rom, equals: {boot: 1}}
  - {name: high, equals: {bank: 2}}
initiators:
  - {name: a0, protocol: axi4, data_width: 32, clock_domain: main, id_width: 2, len_width: 8}
  - {name: m0, protocol: axi4, data_width: 32, clock_domain: main, max_outstanding: 4, id_width: 2, len_width: 8}
  - {name: l0, protocol: axi4_lite, data_width: 32, clock_domain: main}
  - {name: p0, protocol: apb4, data_width: 32, clock_domain: main}
targets:
  - {name: ram, protocol: axi4, data_width: 32, clock_domain: main, attributes: amba,
     address_width: 16, len_width: 8,
     mappings: [{base: '0x0', size: '0x2000', when: {rom: false}},
                {base: '0x10000', size: '0x2000'}]}
  - {name: rom, protocol: apb4, data_width: 32, clock_domain: main, attributes: amba,
     address_width: 16,
     mappings: [{base: '0x0', size: '0x1000', when: {rom: true}},
                {base: '0x20000', size: '0x1000'}]}
  - {name: dev, protocol: axi4_lite, data_width: 32, clock_domain: main, attributes: amba,
     address_width: 16,
     mappings: [{base: '0x4000', size: '0x1000', when: {rom: true, high: true}},
                {base: '0x30000', size: '0x1000'}]}
connectivity: all
output: {backend: verilog, language: verilog_2001}

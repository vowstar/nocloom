schema_version: 10
name: control_tree_apb
address_width: 32
reset_ports: [{name: reset_n}]
test_ports: [{name: test}]
clock_domains:
  - {name: main, clock_port: clk_main, reset_port: reset_n, test_port: test}
initiators:
  - {name: cpu, clock_domain: main, protocol: apb4, data_width: 32}
  - {name: dma, clock_domain: main, protocol: apb4, data_width: 32}
targets:
  - {name: bank00, clock_domain: main, protocol: apb4, data_width: 32, mappings: [{base: "0x0", size: "0x1000"}], attributes: amba}
  - {name: bank01, clock_domain: main, protocol: apb4, data_width: 32, mappings: [{base: "0x1000", size: "0x1000"}], attributes: amba}
  - {name: bank02, clock_domain: main, protocol: apb4, data_width: 32, mappings: [{base: "0x4000", size: "0x2000"}], attributes: amba}
  - {name: bank03, clock_domain: main, protocol: apb4, data_width: 32, mappings: [{base: "0xfffff000", size: "0x1000"}], attributes: amba}
arbitration: {policy: round_robin}
topology:
  request:
    nodes:
      - {name: entry}
      - {name: control}
      - {name: branch}
      - {name: leaf}
    links:
      - {from: entry, to: control}
      - {from: entry, to: branch}
      - {from: branch, to: leaf}
    entries:
      - {endpoint: cpu, node: entry}
      - {endpoint: dma, node: entry}
    exits:
      - {endpoint: bank00, node: control}
      - {endpoint: bank01, node: leaf}
      - {endpoint: bank02, node: leaf}
      - {endpoint: bank03, node: control}
  response:
    nodes:
      - {name: entry}
      - {name: control}
      - {name: branch}
      - {name: leaf}
    links:
      - {from: control, to: entry}
      - {from: branch, to: entry}
      - {from: leaf, to: branch}
    entries:
      - {endpoint: bank00, node: control}
      - {endpoint: bank01, node: leaf}
      - {endpoint: bank02, node: leaf}
      - {endpoint: bank03, node: control}
    exits:
      - {endpoint: cpu, node: entry}
      - {endpoint: dma, node: entry}
connectivity: all
output: {backend: verilog, language: verilog_2001}

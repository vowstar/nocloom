schema_version: 10
name: endpoint_widths
address_width: 32
reset_ports: [{name: reset_n}]
test_ports: [{name: test}]
clock_domains:
  - {name: main, clock_port: clk_main, reset_port: reset_n, test_port: test}
initiators:
  - {name: wide, clock_domain: main, protocol: axi4, data_width: 256, len_width: 8}
  - {name: control, clock_domain: main, protocol: axi4_lite, data_width: 32}
targets:
  - {name: memory0, clock_domain: main, data_width: 32, protocol: axi4, mappings: [{base: '0x0', size: '0x8000'}], len_width: 8, attributes: amba}
  - {name: memory1, clock_domain: main, data_width: 32, protocol: axi4, mappings: [{base: '0x10000', size: '0x8000'}], len_width: 8, attributes: amba}
transport: {max_outstanding: 1, transport_word_bytes: 32}
connectivity: all
output: {backend: verilog, language: verilog_2001}

schema_version: 10
name: peripheral_domains
address_width: 32
reset_ports: [{name: reset_n}]
test_ports: [{name: test}]
clock_domains:
  - {name: source, clock_port: clk_source, reset_port: reset_n, test_port: test}
  - {name: target, clock_port: clk_target, reset_port: reset_n, test_port: test}
synchronizer_stages: 2
initiators:
  - {name: cpu, clock_domain: source, protocol: apb4, data_width: 32}
  - {name: dma, clock_domain: source, protocol: apb4, data_width: 32}
targets:
  - {name: bank0, clock_domain: target, protocol: apb4, data_width: 32, mappings: [{base: "0x0", size: "0x1000"}], attributes: amba}
  - {name: bank1, clock_domain: target, protocol: apb4, data_width: 32, mappings: [{base: "0x1000", size: "0x1000"}], attributes: amba}
arbitration: {policy: round_robin}
connectivity: all
topology:
  request:
    nodes:
      - {name: entry, clock_domain: source}
      - {name: remote, clock_domain: target}
    links:
      - {from: entry, to: remote}
    entries:
      - {endpoint: cpu, node: entry}
      - {endpoint: dma, node: entry}
    exits:
      - {endpoint: bank0, node: remote}
      - {endpoint: bank1, node: remote}
  response:
    nodes:
      - {name: entry, clock_domain: source}
      - {name: remote, clock_domain: target}
    links:
      - {from: remote, to: entry}
    entries:
      - {endpoint: bank0, node: remote}
      - {endpoint: bank1, node: remote}
    exits:
      - {endpoint: cpu, node: entry}
      - {endpoint: dma, node: entry}
output: {backend: verilog, language: verilog_2001}

schema_version: 10
name: target_timeout
address_width: 32
reset_ports: [{name: reset_n}]
test_ports: [{name: test}]
clock_domains: [{name: main, clock_port: clk_main, reset_port: reset_n, test_port: test}]
initiators:
  - {name: cpu0, clock_domain: main, data_width: 32, protocol: axi4, len_width: 8}
  - {name: cpu1, clock_domain: main, data_width: 32, protocol: axi4, len_width: 8}
targets:
  - {name: mem0, clock_domain: main, data_width: 32, protocol: axi4, len_width: 8, attributes: amba, mappings: [{base: '0x10000', size: '0x10000'}],
     timeout: {cycles: 4096, completion: true}}
  - {name: uart0, clock_domain: main, data_width: 32, protocol: apb4, attributes: amba, mappings: [{base: '0x40000', size: '0x1000'}],
     timeout: {cycles: 1024}}
  - {name: gpio0, clock_domain: main, data_width: 32, protocol: axi4_lite, attributes: amba, mappings: [{base: '0x41000', size: '0x1000'}],
     timeout: {cycles: 1024}}
  - {name: rom0, clock_domain: main, data_width: 32, protocol: ahb_v3, attributes: amba, mappings: [{base: '0x42000', size: '0x1000'}],
     timeout: {cycles: 1024}}
  - {name: timer0, clock_domain: main, data_width: 32, protocol: apb4, mappings: [{base: '0x43000', size: '0x1000'}], attributes: amba}
transport:
  max_outstanding: 1
  transport_word_bytes: 4
topology:
  request:
    nodes: [{name: entry0}, {name: entry1}, {name: fanout}]
    links: [{from: entry0, to: fanout}, {from: entry1, to: fanout}]
    entries: [{endpoint: cpu0, node: entry0}, {endpoint: cpu1, node: entry1}]
    exits:
      - {endpoint: mem0, node: fanout}
      - {endpoint: uart0, node: fanout}
      - {endpoint: gpio0, node: fanout}
      - {endpoint: rom0, node: fanout}
      - {endpoint: timer0, node: fanout}
  response:
    nodes: [{name: fanin}]
    links: []
    entries:
      - {endpoint: mem0, node: fanin}
      - {endpoint: uart0, node: fanin}
      - {endpoint: gpio0, node: fanin}
      - {endpoint: rom0, node: fanin}
      - {endpoint: timer0, node: fanin}
    exits: [{endpoint: cpu0, node: fanin}, {endpoint: cpu1, node: fanin}]
connectivity: all
output: {backend: verilog, language: verilog_2001}

schema_version: 10
name: tilelink_uh_target
address_width: 32
clock_gating: false
reset_ports: [{name: reset_n}]
test_ports: [{name: test}]
clock_domains:
  - {name: main, clock_port: clk, reset_port: reset_n, test_port: test}
initiators:
  - name: cpu
    clock_domain: main
    protocol: axi4
    data_width: 128
    id_width: 4
    len_width: 8
    max_outstanding: 4
    default_target: memory
targets:
  - name: memory
    clock_domain: main
    protocol: tl_uh
    data_width: 32
    size_width: 4
    max_transfer_bytes: 4096
    max_outstanding: 3
    read_side_effects: true
    mappings: [{base: '0x0', size: '0x10000'}]
connectivity: all
output: {backend: verilog, language: verilog_2001}

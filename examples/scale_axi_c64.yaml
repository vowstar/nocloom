schema_version: 10
name: scale_axi_n16_s32_clocked
address_width: 32
# 32 AXI4-Lite sources and 32 APB4 targets on a balanced 16-node tree, each endpoint
# in a clock domain of its own: 64 domains. Request node i runs in the domain of
# source 2i, response node i in that of target 2i, so every link crosses domains.

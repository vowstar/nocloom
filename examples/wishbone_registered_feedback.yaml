schema_version: 10
name: wishbone_registered_feedback
address_width: 32
reset_ports: [{name: reset_n}]
test_ports: [{name: test}]
clock_domains:
  - {name: main, clock_port: clk_main, reset_port: reset_n, test_port: test}
initiators:
  - {name: cpu, clock_domain: main, protocol: axi4, data_width: 32,
     id_width: 4, len_width: 8}
targets:
  - name: peripheral
    clock_domain: main
    protocol: wishbone
    data_width: 32
    address_width: 12
    address_unit: byte
    burst_tags: true
    fixed_bursts: single
    mappings: [{base: '0x1000', size: '0x1000'}]
connectivity: all
output: {backend: verilog, language: verilog_2001}

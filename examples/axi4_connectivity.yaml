# Three initiators reach four targets through a sparse connectivity matrix.
# Without a topology NocLoom generates one switch per direction whose outputs
# take only the connected initiators. A disconnected access gets DECERR
# through the default target adapter without a target bus handshake.
schema_version: 10
name: connectivity
address_width: 32
reset_ports: [{name: reset_n}]
test_ports: [{name: test}]
clock_domains: [{name: main, clock_port: clk_main, reset_port: reset_n, test_port: test}]
initiators:
  - {name: cpu, clock_domain: main, protocol: axi4, data_width: 32, len_width: 8}
  - {name: dma, clock_domain: main, protocol: axi4, data_width: 32, len_width: 8}
  - {name: dbg, clock_domain: main, protocol: axi4_lite, data_width: 32}
targets:
  - {name: ram, clock_domain: main, protocol: axi4, data_width: 32, len_width: 8, attributes: amba,
     mappings: [{base: '0x0', size: '0x10000'}]}
  - {name: rom, clock_domain: main, protocol: axi4, data_width: 32, len_width: 8, attributes: amba,
     mappings: [{base: '0x10000', size: '0x10000'}]}
  - {name: uart, clock_domain: main, protocol: apb4, data_width: 32, attributes: amba,
     mappings: [{base: '0x20000', size: '0x1000'}]}
  - {name: timer, clock_domain: main, protocol: apb4, data_width: 32, attributes: amba,
     mappings: [{base: '0x21000', size: '0x1000'}]}
connectivity:
  cpu: [ram, rom, uart, timer]
  dma: [ram]
  dbg: [uart, timer]
output: {backend: verilog, language: verilog_2001}

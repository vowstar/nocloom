<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img">
<title>A 4x4 mesh network</title>
<desc>Sixteen switches in a 4 by 4 grid. Each switch has one initiator and one target. The links between the switches cross like woven strands. One route is highlighted. It goes along the top row first and then down the last column.</desc>
<rect x="1" y="1" width="1198" height="518" rx="16" fill="#0E7F8F" fill-opacity="0.06" stroke="#0E7F8F" stroke-opacity="0.3" stroke-width="2"/>
<text x="88" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#0E7F8F">A 4x4 mesh from a declared graph</text>
<rect x="88" y="122" width="472" height="248" rx="8" fill="#6B7B88" fill-opacity="0.08" stroke="#6B7B88" stroke-opacity="0.45" stroke-width="2"/>
<rect x="108" y="249" width="4" height="100" rx="1" fill="#D9822B"/>
<g font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="17" fill="#6B7B88">
<text x="124" y="162" xml:space="preserve">topology:</text>
<text x="124" y="188" xml:space="preserve">  request:  {nodes: ..., links: ...}</text>
<text x="124" y="214" xml:space="preserve">  response: {nodes: ..., links: ...}</text>
<text x="124" y="240" xml:space="preserve">  routes:</text>
<text x="124" y="266" xml:space="preserve">    - initiator: i0_0</text>
<text x="124" y="292" xml:space="preserve">      target: t3_2</text>
<text x="124" y="318" xml:space="preserve">      request: [q0_0, q1_0, q2_0,</text>
<text x="124" y="344" xml:space="preserve">                q3_0, q3_1, q3_2]</text>
</g>

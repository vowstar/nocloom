<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img">
<title>A mixed-protocol SoC network</title>
<desc>Three initiators connect to a front switch: two 64-bit AXI4 initiators and one AHB-Lite initiator. The front switch connects to a memory switch with an AXI4 target and an AHB-Lite target, and through a clock domain crossing to a peripheral switch with three APB targets in a second clock domain. A second, faint copy of the switches stands for the response graph. One route is highlighted.</desc>
<rect x="1" y="1" width="1198" height="518" rx="16" fill="#0E7F8F" fill-opacity="0.06" stroke="#0E7F8F" stroke-opacity="0.3" stroke-width="2"/>
<text x="88" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#0E7F8F">A mixed-protocol SoC network</text>
<rect x="88" y="122" width="472" height="248" rx="8" fill="#6B7B88" fill-opacity="0.08" stroke="#6B7B88" stroke-opacity="0.45" stroke-width="2"/>
<rect x="108" y="171" width="4" height="74" rx="1" fill="#D9822B"/>
<rect x="108" y="275" width="4" height="74" rx="1" fill="#D9822B"/>
<g font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="17" fill="#6B7B88">
<text x="124" y="162" xml:space="preserve">initiators:</text>
<text x="124" y="188" xml:space="preserve">  - name: cpu</text>
<text x="124" y="214" xml:space="preserve">    protocol: axi4</text>
<text x="124" y="240" xml:space="preserve">    data_width: 64</text>
<text x="124" y="266" xml:space="preserve">targets:</text>
<text x="124" y="292" xml:space="preserve">  - name: uart</text>
<text x="124" y="318" xml:space="preserve">    protocol: apb4</text>
<text x="124" y="344" xml:space="preserve">    clock_domain: periph</text>
</g>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6B7B88">

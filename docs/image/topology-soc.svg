<text x="122" y="432">switch</text>
<rect x="200" y="416" width="20" height="20" rx="3" fill="#6B7B88"/>
<text x="230" y="432">initiator</text>
<rect x="313.5" y="417.5" width="17" height="17" rx="2" fill="none" stroke="#6B7B88" stroke-width="3"/>
<text x="342" y="432">target</text>
<rect x="408" y="422.0" width="32" height="8" rx="1" fill="#D9822B"/>
<text x="450" y="432">fixed route</text>
</g>
<g fill="#6B7B88" fill-opacity="0.07" stroke="#6B7B88" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="6 6">
<rect x="586" y="66" width="558" height="230" rx="12"/>
<rect x="880" y="332" width="264" height="128" rx="12"/>
</g>
<g font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="15" fill="#6B7B88">
<text x="590" y="54">clock domain core</text>
<text x="884" y="322">clock domain periph</text>
<text x="852" y="374" text-anchor="middle">CDC</text>
</g>
